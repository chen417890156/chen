name: Proxy Pool - subs-check
on:
  workflow_dispatch:

jobs:
  check-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: DL
        run: curl -sL -o sc.tar.gz https://ghfast.top/https://github.com/beck-8/subs-check/releases/latest/download/subs-check_Linux_x86_64.tar.gz && tar xzf sc.tar.gz && chmod +x subs-check && ls -la subs-check
      - name: Run
        run: mkdir -p config output && echo '' | base64 -d > config/config.yaml && timeout 240 ./subs-check 2>&1; echo 'EXIT:'$?
      - name: Check output
        if: always()
        run: ls -la output/ 2>/dev/null || echo 'no output dir'
