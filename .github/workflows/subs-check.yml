name: Proxy Pool - subs-check

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  check-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download subs-check
        run: |
          curl -sL -o subs-check.tar.gz "https://ghfast.top/https://github.com/beck-8/subs-check/releases/latest/download/subs-check_Linux_x86_64.tar.gz"
          tar xzf subs-check.tar.gz
          chmod +x subs-check
      - name: Write config
        run: |
          mkdir -p config output
          echo '' | base64 -d > config/config.yaml
      - name: Run subs-check
        run: ./subs-check 2>&1 || true
      - name: Upload output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output
          path: output/
