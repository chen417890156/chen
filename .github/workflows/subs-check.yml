name: Proxy Pool - subs-check

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  check-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download subs-check
        run: |
          curl -sL -o sc.tar.gz "https://github.com/beck-8/subs-check/releases/latest/download/subs-check_Linux_x86_64.tar.gz"
          tar xzf sc.tar.gz
          chmod +x subs-check
      - name: Write config
        run: |
          mkdir -p config output
          echo '' | base64 -d > config/config.yaml
      - name: Run subs-check
        run: |
          ./subs-check 2>&1 || true
