name: Proxy Pool

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run proxy check
        run: |
          python3 << 'PYEOF'
import urllib.request, base64, json, time, re, subprocess

GIST_TOKEN = "${{ secrets.GIST_TOKEN }}"
GIST_ID = "74fbd1303b40fe0105ea72dc3363f1eb"

# 1. Download subscriptions
urls = [
  "https://raw.githubusercontent.com/snakem982/proxypool/main/source/clash-meta.yaml",
  "https://raw.githubusercontent.com/firefoxmmx2/v2rayshare_subcription/main/subscription/clash_sub.yaml",
  "https://raw.githubusercontent.com/mahdibland/SSAggregator/master/sub/sub_merge_yaml.yml",
  "https://raw.githubusercontent.com/chengaopan/AutoMergePublicNodes/master/list.yml",
]

all_proxies = []
for url in urls:
    try:
        req = urllib.request.Request(url, headers={"User-Agent": "curl/8.0"})
        data = urllib.request.urlopen(req, timeout=15).read().decode()
        for line in data.split("\n"):
            if line.strip().startswith("- "):
                all_proxies.append(line.strip())
    except:
        pass

print(f"Total nodes: {len(all_proxies)}")

# 2. Simple TCP ping test (connect to server:port, measure time)
import socket
good_proxies = []
tested = 0
for proxy in all_proxies[:200]:  # test first 200
    tested += 1
    try:
        # Extract server:port from proxy line
        parts = proxy.split(",")
        server = ""
        port = 443
        for p in parts:
            p = p.strip()
            if p.startswith("server: "):
                server = p.replace("server: ", "").strip(""'")
            elif p.startswith("port: "):
                port = int(p.replace("port: ", "").strip(""'"))
        if server and port:
            start = time.time()
            s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
            s.settimeout(3)
            s.connect((server, port))
            s.close()
            latency = int((time.time() - start) * 1000)
            if latency < 5000:
                good_proxies.append(proxy + f"  # latency={latency}ms")
    except:
        pass

print(f"Good nodes: {len(good_proxies)}/{tested}")

# 3. Build output
yaml_out = "proxies:\n"
for p in good_proxies[:30]:
    yaml_out += f"  {p}\n"

b64_out = base64.b64encode(yaml_out.encode()).decode()

# 4. Upload to Gist
payload = json.dumps({
    "description": "proxy pool",
    "files": {
        "mihomo.yaml": {"content": yaml_out},
        "base64.txt": {"content": b64_out}
    }
}).encode()
req = urllib.request.Request(
    f"https://api.github.com/gists/{GIST_ID}",
    data=payload,
    headers={"Authorization": "token " + GIST_TOKEN, "Content-Type": "application/json"},
    method="PATCH"
)
urllib.request.urlopen(req, timeout=15)
print("Gist updated!")
PYEOF
