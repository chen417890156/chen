name: Proxy Pool - subs-check
on:
  workflow_dispatch:

jobs:
  check-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: DL
        run: curl -sL -o sc.tar.gz https://ghfast.top/https://github.com/beck-8/subs-check/releases/latest/download/subs-check_Linux_x86_64.tar.gz && tar xzf sc.tar.gz && chmod +x subs-check
      - name: Run
        run: mkdir -p config output && echo '' | base64 -d > config/config.yaml && ./subs-check 2>&1 || true
      - name: Upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output
          path: output/
